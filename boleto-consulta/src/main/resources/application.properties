quarkus.http.port=8082
quarkus.http.auth.basic=true

%dev.quarkus.http.port=8082
quarkus.http.test-port=0

quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:consulta-dev;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:consulta-test;DB_CLOSE_DELAY=-1
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:consulta-prod;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true

%dev.cobranca.consulta.carregar-exemplo=true
%test.cobranca.consulta.carregar-exemplo=true
%prod.cobranca.consulta.carregar-exemplo=false

%dev.cobranca.security.seed-users=true
%test.cobranca.security.seed-users=true
%prod.cobranca.security.seed-users=false
