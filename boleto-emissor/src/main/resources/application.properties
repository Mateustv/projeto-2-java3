quarkus.http.port=8080
quarkus.http.auth.basic=true

%dev.quarkus.http.port=8080
quarkus.http.test-port=0

quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:emissor-dev;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:emissor-test;DB_CLOSE_DELAY=-1
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:emissor-prod;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true

%dev.cobranca.boleto.valor-maximo=${COBRANCA_BOLETO_VALOR_MAXIMO:100000.00}
%test.cobranca.boleto.valor-maximo=100000.00
%prod.cobranca.boleto.valor-maximo=${COBRANCA_BOLETO_VALOR_MAXIMO:100000.00}

%dev.cobranca.security.seed-users=true
%test.cobranca.security.seed-users=true
%prod.cobranca.security.seed-users=false

%dev.quarkus.rest-client.registro.url=http://localhost:8081
%test.quarkus.rest-client.registro.url=http://localhost:8081
%prod.quarkus.rest-client.registro.url=${REGISTRO_URL:http://localhost:8081}

%dev.registro.auth.username=${REGISTRO_AUTH_USERNAME:operador}
%dev.registro.auth.password=${REGISTRO_AUTH_PASSWORD:operador123}
%test.registro.auth.username=${REGISTRO_AUTH_USERNAME:operador}
%test.registro.auth.password=${REGISTRO_AUTH_PASSWORD:operador123}
%prod.registro.auth.username=${REGISTRO_AUTH_USERNAME}
%prod.registro.auth.password=${REGISTRO_AUTH_PASSWORD}

br.com.caixa.cobranca.emissor.services.RegistroGateway/registrar/Timeout/value=500
br.com.caixa.cobranca.emissor.services.RegistroGateway/registrar/Retry/maxRetries=2
br.com.caixa.cobranca.emissor.services.RegistroGateway/registrar/CircuitBreaker/requestVolumeThreshold=4
